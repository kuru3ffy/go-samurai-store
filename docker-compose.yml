services:
  # データベース（MySQL）サービス
  db:
    image: mysql:8.0
    container_name: go-samurai-store-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - go-samurai-store-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # バックエンド（Go/Gin）サービス
  backend:
    container_name: go-samurai-store-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      DB_DSN: ${DB_DSN}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - go-samurai-store-network

  # フロントエンド（Next.js）サービス
  frontend:
    container_name: go-samurai-store-frontend
    # frontend/Dockerfile.devファイルを使ってビルドする
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      # ホストPCの3000番ポートを、コンテナの3000番ポートに接続する
      - "3000:3000"
    volumes:
      # ホストPCのfrontendフォルダとコンテナを同期する（ホットリロードのため）
      - ./frontend:/app
      # node_modulesは同期対象から除外する（パフォーマンス向上のため）
      - /app/node_modules
      - /app/.next
    environment:
      # APIのベースURLを設定する（フロントエンドからバックエンドへのリクエストに使用）
      API_BASE_URL: "http://backend:8080"
      # Next.jsのホットリロードを有効にする
      WATCHPACK_POLLING: "true"
    depends_on:
      # backendサービスが起動してからfrontendサービスを起動する
      - backend
    networks:
      - go-samurai-store-network

# サービス間で通信するためのカスタムネットワーク
networks:
  go-samurai-store-network:
    driver: bridge

volumes:
  mysql_data:
